<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #617085;
        --border: #dce5ef;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --danger: #b91c1c;
        --success: #166534;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
        overflow: hidden;
      }

      .header {
        padding: 26px 28px 18px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 18px;
        padding: 24px 28px 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 14px;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        padding: 12px 13px;
      }

      textarea {
        resize: vertical;
        min-height: 96px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #93c5fd;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-top: 4px;
      }

      button {
        min-height: 46px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 800;
        padding: 0 18px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .message {
        display: none;
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: 700;
        line-height: 1.45;
      }

      .message.error {
        display: block;
        background: #fef2f2;
        color: var(--danger);
        border: 1px solid #fecaca;
      }

      .message.success {
        display: block;
        background: #ecfdf5;
        color: var(--success);
        border: 1px solid #bbf7d0;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 760px);
          padding: 10px 0;
        }

        .header,
        form {
          padding-left: 18px;
          padding-right: 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="header">
          <h1>Staff Absence Request</h1>
          <p class="subtitle">Submit an absence request for manager review.</p>
        </div>

        <form id="absence-form">
          <input type="hidden" id="submission_uuid" name="submission_uuid">

          <div id="message" class="message" role="status" aria-live="polite"></div>

          <div class="grid">
            <div class="field full">
              <label for="staff_email">District Email</label>
              <input type="email" id="staff_email" name="staff_email" autocomplete="email" required>
            </div>

            <div class="field">
              <label for="absence_type">Absence Type</label>
              <select id="absence_type" name="absence_type" required></select>
            </div>

            <div class="field">
              <label for="duration_mode">Duration</label>
              <select id="duration_mode" name="duration_mode" required></select>
            </div>

            <div class="field">
              <label for="start_date">Start Date</label>
              <input type="date" id="start_date" name="start_date" required>
            </div>

            <div class="field" id="end-date-field" hidden>
              <label for="end_date">End Date</label>
              <input type="date" id="end_date" name="end_date">
            </div>

            <div class="field" id="start-time-field" hidden>
              <label for="start_time">Start Time</label>
              <input type="time" id="start_time" name="start_time">
            </div>

            <div class="field" id="days-value-field" hidden>
              <label for="days_value">Total Days</label>
              <input type="number" id="days_value" name="days_value" min="0.25" step="0.25">
            </div>

            <div class="field full">
              <label for="note">Notes</label>
              <textarea id="note" name="note" maxlength="1000"></textarea>
            </div>
          </div>

          <div class="actions">
            <button type="submit" id="submit-button">Submit Request</button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const state = {
        durationOptions: []
      };

      const form = document.getElementById('absence-form');
      const message = document.getElementById('message');
      const submitButton = document.getElementById('submit-button');
      const submissionUuidInput = document.getElementById('submission_uuid');
      const emailInput = document.getElementById('staff_email');
      const absenceTypeSelect = document.getElementById('absence_type');
      const durationSelect = document.getElementById('duration_mode');
      const startDateInput = document.getElementById('start_date');
      const endDateField = document.getElementById('end-date-field');
      const endDateInput = document.getElementById('end_date');
      const startTimeField = document.getElementById('start-time-field');
      const startTimeInput = document.getElementById('start_time');
      const daysValueField = document.getElementById('days-value-field');
      const daysValueInput = document.getElementById('days_value');

      function setMessage(text, type) {
        message.textContent = text || '';
        message.className = text ? 'message ' + type : 'message';
      }

      function populateSelect(select, options) {
        select.innerHTML = '';
        options.forEach(function(option) {
          const element = document.createElement('option');
          element.value = option.value;
          element.textContent = option.label;
          select.appendChild(element);
        });
      }

      function selectedDuration() {
        return state.durationOptions.find(function(option) {
          return option.value === durationSelect.value;
        });
      }

      function updateDurationFields() {
        const duration = selectedDuration();
        if (!duration) return;

        endDateField.hidden = !duration.requiresEndDate;
        endDateInput.required = !!duration.requiresEndDate;

        daysValueField.hidden = !duration.requiresDays;
        daysValueInput.required = !!duration.requiresDays;

        startTimeField.hidden = !duration.requiresStartTime && duration.value !== 'multi_day';
        startTimeInput.required = !!duration.requiresStartTime;

        if (!duration.requiresEndDate) {
          endDateInput.value = startDateInput.value;
        }

        if (!duration.requiresDays) {
          daysValueInput.value = '';
        }

        if (!duration.requiresStartTime && duration.value !== 'multi_day') {
          startTimeInput.value = '';
        }
      }

      function collectPayload() {
        return {
          submission_uuid: submissionUuidInput.value,
          staff_email: emailInput.value,
          absence_type: absenceTypeSelect.value,
          duration_mode: durationSelect.value,
          start_date: startDateInput.value,
          end_date: endDateInput.value,
          start_time: startTimeInput.value,
          days_value: daysValueInput.value,
          note: document.getElementById('note').value
        };
      }

      function resetForAnotherRequest() {
        form.reset();
        submissionUuidInput.value = makeSubmissionUuid();
        updateDurationFields();
      }

      function makeSubmissionUuid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }

        return String(Date.now()) + '-' + String(Math.random()).slice(2);
      }

      function onSubmit(event) {
        event.preventDefault();
        setMessage('', '');

        if (!form.reportValidity()) {
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Submitting...';

        google.script.run
          .withSuccessHandler(function() {
            setMessage('Your absence request has been submitted for approval.', 'success');
            resetForAnotherRequest();
            submitButton.disabled = false;
            submitButton.textContent = 'Submit Request';
          })
          .withFailureHandler(function(error) {
            setMessage(error && error.message ? error.message : 'Unable to submit your absence request.', 'error');
            submitButton.disabled = false;
            submitButton.textContent = 'Submit Request';
          })
          .submitAbsenceRequest(collectPayload());
      }

      function init(config) {
        state.durationOptions = config.durationOptions || [];
        populateSelect(absenceTypeSelect, config.absenceTypes || []);
        populateSelect(durationSelect, state.durationOptions);

        if (config.activeUserEmail) {
          emailInput.value = config.activeUserEmail;
        }

        submissionUuidInput.value = makeSubmissionUuid();
        durationSelect.addEventListener('change', updateDurationFields);
        startDateInput.addEventListener('change', updateDurationFields);
        form.addEventListener('submit', onSubmit);
        updateDurationFields();
      }

      google.script.run
        .withSuccessHandler(init)
        .withFailureHandler(function(error) {
          setMessage(error && error.message ? error.message : 'Unable to load the absence form.', 'error');
          submitButton.disabled = true;
        })
        .getFormConfig();
    </script>
  </body>
</html>
