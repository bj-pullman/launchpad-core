<!doctype html><html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{--navy:#172b4d;--green:#177245;--red:#b42318;--ink:#172033;--muted:#617084;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dfeaf5,#f7f9fc 260px);color:var(--ink);font-family:Arial,sans-serif}main{width:min(100% - 24px,620px);margin:auto;padding:22px 0 40px}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 18px 46px rgba(23,43,77,.14)}header{padding:24px 20px;background:linear-gradient(135deg,#172b4d,#294974);color:#fff}.brand{font-size:1.12rem;font-weight:850}.product{margin-top:3px;color:#cdd9e8;font-size:.82rem}.hero,.section,.actions,.meta{padding:21px 20px;border-top:1px solid var(--line)}.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{margin:0 0 8px;font-size:1.6rem}p{margin:4px 0;line-height:1.5}.muted{color:var(--muted)}.badge{padding:7px 10px;border-radius:999px;background:#fff1c2;color:#805c00;font-size:.72rem;font-weight:850;text-transform:uppercase}.badge.approved{background:#dcfce7;color:#166534}.badge.denied{background:#fee2e2;color:#991b1b}.eyebrow{margin-bottom:7px;color:#2563eb;font-size:.72rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.summary{background:#f8fafc}.summary h2{margin:0 0 8px;font-size:1.14rem}.summary strong{display:block;font-size:1.18rem}.note{white-space:pre-wrap}label{display:block;margin-bottom:7px;font-weight:750}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #bdcad7;border-radius:11px;font:16px/1.45 Arial;resize:vertical}.buttons{display:grid;gap:10px;margin-top:14px}button{width:100%;min-height:52px;border:0;border-radius:11px;color:#fff;font:800 16px Arial;cursor:pointer}.approve{background:var(--green)}.deny{background:var(--red)}button:disabled{opacity:.65}.loading,.result{padding:44px 20px;text-align:center}.message{padding:13px;border:1px solid #efb1ac;border-radius:10px;background:#fff1f0;color:#8f1d16;font-weight:700}.meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}@media(min-width:560px){main{padding-top:36px}header,.hero,.section,.actions,.meta{padding-left:30px;padding-right:30px}.buttons{grid-template-columns:1fr 1fr}.deny{order:-1}}
</style></head><body><main><section class="card"><header><div class="brand">Launchpad</div><div class="product">Staff Status</div></header><div id="loading" class="loading">Loading absence request…</div><div id="error" class="section" hidden><div class="message" role="alert"></div></div><div id="content" hidden><section class="hero"><div class="hero-head"><div><h1 id="name"></h1><p id="email" class="muted"></p></div><span id="status" class="badge"></span></div></section><section class="section summary"><div class="eyebrow">Request Summary</div><h2 id="type"></h2><strong id="dates"></strong><p id="duration" class="muted"></p></section><section class="section"><div class="eyebrow">Staff Note</div><p id="note" class="note"></p></section><section id="decision" class="actions"><label for="decision-note">Decision Note <span class="muted">(optional)</span></label><textarea id="decision-note" maxlength="1000"></textarea><div class="buttons"><button class="deny" data-value="denied">Deny Request</button><button class="approve" data-value="approved">Approve Request</button></div></section><section id="final" class="result" hidden><h2 id="final-title"></h2><p id="final-copy"></p><p class="muted">Launchpad will synchronize this decision shortly.</p></section><footer class="meta">Signed in as <span id="reviewer"></span><br>Submission ID: <?= requestId ?></footer></div></section></main><script>
const id=<?= JSON.stringify(requestId) ?>,loading=document.getElementById('loading'),content=document.getElementById('content'),errorBox=document.getElementById('error');function el(id){return document.getElementById(id)}function fail(e){loading.hidden=true;content.hidden=true;errorBox.hidden=false;errorBox.querySelector('.message').textContent=e&&e.message?e.message:'The request could not be loaded.'}function render(r){loading.hidden=true;errorBox.hidden=true;content.hidden=false;el('name').textContent=r.staffName;el('email').textContent=r.staffEmail;el('status').textContent=r.status;el('status').className='badge '+r.status;el('type').textContent=r.absenceType;el('dates').textContent=r.endDate?r.startDate+' – '+r.endDate:r.startDate;el('duration').textContent=r.duration+(r.days?' · '+r.days+' days':'')+' · '+r.startTime;el('note').textContent=r.note;el('reviewer').textContent=r.reviewer;if(r.status!=='pending'){el('decision').hidden=true;el('final').hidden=false;el('final-title').textContent=r.status==='approved'?'Approved':'Denied';el('final-copy').textContent=r.staffName+"'s request has been "+r.status+'.';}}function decide(value){if(!confirm((value==='approved'?'Approve':'Deny')+' this request? This decision is final.'))return;document.querySelectorAll('button').forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(render).withFailureHandler(fail).submitReviewDecision(id,value,el('decision-note').value)}document.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>decide(b.dataset.value)));google.script.run.withSuccessHandler(render).withFailureHandler(fail).getReviewRequest(id);
</script></body></html>
