{% if session.get("is_authenticated") %}
<div class="nav-dropdown nav-dropdown-account">
  <button class="nav-dropdown-btn" type="button" aria-haspopup="true">
    Account
    <span class="nav-caret" aria-hidden="true">▾</span>
  </button>
  <div class="nav-dropdown-menu nav-dropdown-menu-account">
    {% include "layouts/_theme_picker.html" %}
    <div class="nav-dropdown-divider"></div>
    <a href="{{ url_for('auth.logout') }}" class="nav-dropdown-item nav-dropdown-logout">Logout</a>
  </div>
</div>
{% else %}
<a href="{{ url_for('auth.login') }}" class="topbar-link">Login</a>
{% endif %}
