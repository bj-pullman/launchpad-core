<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { --navy:#172b4d; --green:#177245; --red:#b42318; --ink:#172033; --muted:#617084; --line:#d9e2ec; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#dfeaf5,#f7f9fc 260px); color:var(--ink); font-family:Arial,sans-serif; }
    main { width:min(100% - 24px,620px); margin:auto; padding:22px 0 40px; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 18px 46px rgba(23,43,77,.14); }
    header { padding:24px 20px; background:linear-gradient(135deg,#172b4d,#294974); color:#fff; }
    .brand { font-size:1.12rem; font-weight:850; }
    .product { margin-top:3px; color:#cdd9e8; font-size:.82rem; }
    .hero,.section,.actions,.meta { padding:21px 20px; border-top:1px solid var(--line); }
    .hero-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    h1 { margin:0 0 8px; font-size:1.6rem; }
    p { margin:4px 0; line-height:1.5; }
    .muted { color:var(--muted); }
    .badge { padding:7px 10px; border-radius:999px; background:#fff1c2; color:#805c00; font-size:.72rem; font-weight:850; text-transform:uppercase; }
    .badge.approved { background:#dcfce7; color:#166534; }
    .badge.denied { background:#fee2e2; color:#991b1b; }
    .eyebrow { margin-bottom:7px; color:#2563eb; font-size:.72rem; font-weight:850; letter-spacing:.1em; text-transform:uppercase; }
    .summary { background:#f8fafc; }
    .summary h2 { margin:0 0 8px; font-size:1.14rem; }
    .summary strong { display:block; font-size:1.18rem; line-height:1.4; }
    .note { white-space:pre-wrap; }
    label { display:block; margin-bottom:7px; font-weight:750; }
    textarea { width:100%; min-height:110px; padding:12px; border:1px solid #bdcad7; border-radius:11px; font:16px/1.45 Arial; resize:vertical; }
    textarea:focus,button:focus-visible { outline:3px solid #f2b134; outline-offset:2px; }
    .buttons { display:grid; gap:10px; margin-top:14px; }
    button { width:100%; min-height:52px; border:0; border-radius:11px; color:#fff; font:800 16px Arial; cursor:pointer; }
    .approve { background:var(--green); }
    .deny { background:var(--red); }
    button:disabled { opacity:.65; cursor:wait; }
    .loading,.result { padding:44px 20px; text-align:center; }
    .message { padding:13px; border:1px solid #efb1ac; border-radius:10px; background:#fff1f0; color:#8f1d16; font-weight:700; }
    .decision-feedback { margin-top:14px; }
    .decision-progress { color:var(--muted); font-weight:800; text-align:center; }
    .meta { font-size:.8rem; color:var(--muted); overflow-wrap:anywhere; }
    .modal-backdrop { position:fixed; inset:0; z-index:50; display:grid; place-items:end center; padding:14px; background:rgba(10,23,42,.62); backdrop-filter:blur(3px); }
    .modal-card { width:min(100%,480px); padding:24px 20px calc(20px + env(safe-area-inset-bottom)); border-radius:20px; background:#fff; box-shadow:0 24px 70px rgba(10,23,42,.34); }
    .modal-card h2 { margin:0 0 18px; font-size:1.45rem; }
    .modal-summary { padding:16px; border:1px solid var(--line); border-radius:13px; background:#f8fafc; }
    .modal-summary strong,.modal-summary span { display:block; }
    .modal-summary strong { margin-bottom:7px; font-size:1.1rem; }
    .modal-summary span { margin-top:4px; color:var(--muted); }
    .modal-copy { margin:17px 0; color:var(--muted); }
    .modal-actions { display:grid; gap:10px; }
    .modal-cancel { border:1px solid #cbd5e1; background:#fff; color:var(--ink); }
    .modal-confirm.approved { background:var(--green); }
    .modal-confirm.denied { background:var(--red); }
    [hidden] { display:none!important; }
    @media(min-width:560px) { main{padding-top:36px} header,.hero,.section,.actions,.meta{padding-left:30px;padding-right:30px} .buttons,.modal-actions{grid-template-columns:1fr 1fr} .deny{order:-1} .modal-backdrop{place-items:center} .modal-card{padding:28px} }
  </style>
</head>
<body>
<main><section class="card">
  <header><div class="brand">Launchpad</div><div class="product">Staff Status</div></header>
  <div id="loading" class="loading">Loading absence request…</div>
  <div id="error" class="section" hidden><div class="message" role="alert"></div></div>
  <div id="content" hidden>
    <section class="hero"><div class="hero-head"><div><h1 id="staff-name"></h1><p id="department"></p><p id="staff-email" class="muted"></p></div><span id="status" class="badge"></span></div></section>
    <section class="section summary"><div class="eyebrow">Request Summary</div><h2 id="absence-type"></h2><strong id="dates"></strong><p id="duration" class="muted"></p></section>
    <section class="section"><div class="eyebrow">Staff Note</div><p id="staff-note" class="note"></p></section>
    <section id="decision" class="actions"><label for="decision-note">Decision Note <span class="muted">(optional)</span></label><textarea id="decision-note" maxlength="1000" placeholder="Add context for the staff member"></textarea><div id="decision-error" class="message decision-feedback" role="alert" hidden></div><div id="decision-progress" class="decision-progress decision-feedback" role="status" hidden></div><div class="buttons"><button class="deny" data-decision="denied">Deny Request</button><button class="approve" data-decision="approved">Approve Request</button></div></section>
    <section id="final" class="result" hidden><h2 id="final-title"></h2><p id="final-copy"></p><p class="muted">Launchpad will synchronize this decision shortly.</p></section>
    <footer class="meta">Signed in as <span id="reviewer"></span><br>Submission ID: <?= requestId ?></footer>
  </div>
</section></main>
<div id="decision-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="decision-modal-title" hidden>
  <div class="modal-card">
    <h2 id="decision-modal-title">Confirm decision</h2>
    <div class="modal-summary"><strong id="modal-staff-name"></strong><span id="modal-absence-type"></span><span id="modal-date"></span></div>
    <p class="modal-copy">This decision will be sent to Launchpad.</p>
    <div class="modal-actions"><button id="modal-cancel" type="button" class="modal-cancel">Cancel</button><button id="modal-confirm" type="button" class="modal-confirm">Confirm</button></div>
  </div>
</div>
<script>
  const requestId = <?!= JSON.stringify(requestId) ?>;
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');
  const errorBox = document.getElementById('error');
  let currentRequest = null;
  let pendingDecision = null;
  let decisionSubmitting = false;
  function element(id) { return document.getElementById(id); }
  function showError(error) {
    loading.hidden=true; content.hidden=true; errorBox.hidden=false;
    errorBox.querySelector('.message').textContent=error&&error.message?error.message:'The request could not be loaded.';
  }
  function render(request) {
    currentRequest=request;
    decisionSubmitting=false;
    loading.hidden=true; errorBox.hidden=true; content.hidden=false;
    element('staff-name').textContent=request.staffName;
    element('department').textContent=request.department;
    element('staff-email').textContent=request.staffEmail;
    element('status').textContent=request.status;
    element('status').className='badge '+request.status;
    element('absence-type').textContent=request.absenceType;
    element('dates').textContent=request.endDate?request.startDate+' – '+request.endDate:request.startDate;
    element('duration').textContent=request.duration+(request.days?' · '+request.days+' days':'')+' · '+request.startTime;
    element('staff-note').textContent=request.note;
    element('reviewer').textContent=request.reviewer;
    element('decision-error').hidden=true;
    element('decision-progress').hidden=true;
    setDecisionButtonsDisabled(false);
    if(request.status!=='pending') {
      element('decision').hidden=true; element('final').hidden=false;
      element('final-title').textContent=request.status==='approved'?'Approved':'Denied';
      element('final-copy').textContent=request.staffName+"'s absence request has been "+request.status+'.';
    }
  }
  function setDecisionButtonsDisabled(disabled) {
    document.querySelectorAll('[data-decision]').forEach(function(button){button.disabled=disabled;});
    element('modal-confirm').disabled=disabled;
  }
  function openDecisionModal(value) {
    if(decisionSubmitting || !currentRequest || currentRequest.status!=='pending') return;
    pendingDecision=value;
    const approving=value==='approved';
    element('decision-modal-title').textContent=approving?'Approve this request?':'Deny this request?';
    element('modal-staff-name').textContent=currentRequest.staffName;
    element('modal-absence-type').textContent=currentRequest.absenceType;
    element('modal-date').textContent=currentRequest.endDate?currentRequest.startDate+' – '+currentRequest.endDate:currentRequest.startDate;
    const confirmButton=element('modal-confirm');
    confirmButton.textContent=approving?'Approve Request':'Deny Request';
    confirmButton.className='modal-confirm '+value;
    element('decision-modal').hidden=false;
    element('modal-cancel').focus();
  }
  function closeDecisionModal() {
    if(decisionSubmitting) return;
    pendingDecision=null;
    element('decision-modal').hidden=true;
  }
  function submitConfirmedDecision() {
    if(decisionSubmitting || !pendingDecision) return;
    decisionSubmitting=true;
    const decision=pendingDecision;
    element('decision-modal').hidden=true;
    element('decision-error').hidden=true;
    element('decision-progress').textContent=decision==='approved'?'Approving request…':'Denying request…';
    element('decision-progress').hidden=false;
    setDecisionButtonsDisabled(true);
    google.script.run.withSuccessHandler(render).withFailureHandler(function(error){
      decisionSubmitting=false;
      pendingDecision=null;
      element('decision-progress').hidden=true;
      setDecisionButtonsDisabled(false);
      element('decision-error').textContent=error&&error.message?error.message:'The decision could not be submitted. Please try again.';
      element('decision-error').hidden=false;
    }).submitReviewDecision(requestId,decision,element('decision-note').value);
  }
  document.querySelectorAll('[data-decision]').forEach(function(button){button.addEventListener('click',function(){openDecisionModal(button.dataset.decision);});});
  element('modal-cancel').addEventListener('click',closeDecisionModal);
  element('modal-confirm').addEventListener('click',submitConfirmedDecision);
  element('decision-modal').addEventListener('click',function(event){if(event.target===element('decision-modal'))closeDecisionModal();});
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!element('decision-modal').hidden)closeDecisionModal();});
  google.script.run.withSuccessHandler(render).withFailureHandler(showError).getReviewRequest(requestId);
</script>
</body></html>
