<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(180deg,#e5edf6,#f7f9fc); color:#172033; font-family:Arial,sans-serif; }
    .card { width:min(100%,480px); padding:38px 24px; border:1px solid #d4dee9; border-radius:18px; background:#fff; box-shadow:0 16px 40px rgba(23,43,77,.12); text-align:center; }
    .icon { display:grid; place-items:center; width:60px; height:60px; margin:0 auto 18px; border-radius:50%; background:#fee2e2; color:#991b1b; font-size:27px; font-weight:900; }
    h1 { margin:0 0 12px; font-size:1.6rem; }
    p { margin:0; color:#5f6f82; line-height:1.55; }
    .account { margin:18px 0; padding:13px; border:1px solid #dbe3ec; border-radius:11px; background:#f8fafc; color:#172033; font-weight:800; overflow-wrap:anywhere; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; margin-top:24px; padding:12px 18px; border-radius:10px; background:#1769aa; color:#fff; font-weight:800; text-decoration:none; }
    .help { margin-top:16px; font-size:.86rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">!</div>
    <h1><?= deniedTitle ?></h1>
    <? if (signedInEmail) { ?>
      <p>You're signed in as:</p>
      <div class="account"><?= signedInEmail ?></div>
    <? } ?>
    <p><?= deniedMessage ?></p>
    <a href="https://accounts.google.com/AccountChooser" target="_top">Switch Google Account</a>
    <p class="help">After switching accounts, reopen the reviewer link from your email.</p>
  </main>
</body>
</html>
